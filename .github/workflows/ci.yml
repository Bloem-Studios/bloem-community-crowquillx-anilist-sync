name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - run: go test ./...
        env:
          CGO_ENABLED: "0"
      - run: go vet ./...
        env:
          CGO_ENABLED: "0"
      - name: Validate embedded manifest
        run: |
          go run . manifest > /tmp/manifest.json
          jq -e '.pluginId == "dev.crowquillx.anilist-sync"' /tmp/manifest.json
        env:
          CGO_ENABLED: "0"
